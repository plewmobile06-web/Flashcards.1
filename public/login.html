<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เข้าสู่ระบบ</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: Arial, sans-serif;
  background:#f0f2f5;
}

.card{
  background:white;
  padding:40px;
  border-radius:20px;
  width:320px;
  text-align:center;
  box-shadow:0 15px 35px rgba(0,0,0,0.1);
}

h2{
  margin-bottom:20px;
  color: #333;
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  font-size:16px;
  border-radius:8px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  font-size:16px;
  border:none;
  border-radius:10px;
  background:#4CAF50;
  color:white;
  cursor:pointer;
  font-weight: bold;
  transition: 0.3s;
}

button:hover{
  background:#45a049;
}
</style>
</head>

<body>

<div class="card">
  <h2>เข้าสู่ระบบ</h2>

  <form id="loginForm">
    <input id="name" placeholder="ชื่อผู้ใช้" required autocomplete="off">

    <input 
      id="password"
      type="password"
      placeholder="รหัสผ่าน"
      required
    >

    <button type="submit">เข้าสู่ระบบ</button>
  </form>
</div>

<script>
const form = document.getElementById("loginForm");
const nameInput = document.getElementById("name");
const passwordInput = document.getElementById("password");

/* ✨ ระบบ Auto-Capitalize และการกด Enter เพื่อย้ายช่อง */
let isShiftPressed = false;

nameInput.addEventListener("keydown", (e) => {
    if (e.key === "Shift") isShiftPressed = true;

    // ⬇️ ถ้ากด Enter ในช่องชื่อ ให้ย้ายไปช่องรหัสผ่าน
    if (e.key === "Enter") {
        e.preventDefault(); // กันฟอร์มส่งข้อมูลทันที
        passwordInput.focus();
    }
});

nameInput.addEventListener("keyup", (e) => {
    if (e.key === "Shift") isShiftPressed = false;
});

nameInput.addEventListener("input", function(e) {
    let cursorStart = this.selectionStart;
    let val = this.value;
    let lastCharIndex = cursorStart - 1;
    
    if (lastCharIndex >= 0) {
        let isFirstChar = (lastCharIndex === 0);
        let isAfterSpace = (val.charAt(lastCharIndex - 1) === " ");

        if ((isFirstChar || isAfterSpace) && !isShiftPressed) {
            let char = val.charAt(lastCharIndex);
            this.value = val.slice(0, lastCharIndex) + char.toUpperCase() + val.slice(cursorStart);
            this.setSelectionRange(cursorStart, cursorStart);
        }
    }
});

/* 🔥 กัน Space และระบบ Enter ในช่องรหัสผ่าน */
passwordInput.addEventListener("keydown", function(e){
    if(e.key === " "){
        e.preventDefault();
    }
    // หมายเหตุ: โดยปกติถ้ากด Enter ในช่องสุดท้ายของฟอร์ม 
    // Browser จะสั่ง Submit ให้โดยอัตโนมัติอยู่แล้วครับ
});

passwordInput.addEventListener("input", function(){
    this.value = this.value.replace(/\s/g, "");
});

/* 🔥 ฟังก์ชันส่งข้อมูลเข้าสู่เกม */
form.addEventListener("submit", function(e){
    e.preventDefault();

    const nameValue = nameInput.value.trim();
    const passwordValue = passwordInput.value;

    if(!nameValue || !passwordValue){
        alert("กรอกข้อมูลให้ครบ");
        return;
    }

    localStorage.setItem("name", nameValue);
    localStorage.setItem("password", passwordValue);
    localStorage.setItem("playerName", nameValue);
    localStorage.setItem("playerPass", passwordValue);

    location.href = "menu.html";
});
</script>

</body>
</html>
