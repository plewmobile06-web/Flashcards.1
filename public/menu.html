<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>FlashAI - Select Category</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');
        
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Kanit', sans-serif;
            background: #f0f2f5;
        }

        .card {
            background: white;
            padding: 50px 40px;
            width: 100%;
            max-width: 650px;
            text-align: center;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        h1 { color: #2b78e4; font-size: 42px; margin-bottom: 5px; }
        .user-info { color: #888; margin-bottom: 35px; font-size: 18px; }
        h3 { font-size: 24px; margin-bottom: 25px; color: #333; }

        #categoryArea {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .cat-item-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        /* ปุ่มสีฟ้าหลัก */
        .cat-btn {
            padding: 12px 35px;
            border: 2px solid transparent; 
            border-radius: 50px;
            background: #e8f0fe;
            color: #2b78e4;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            min-width: 120px;
            user-select: none; /* กันการคลุมดำตัวอักษรเวลาใช้คีย์บอร์ด */
            -webkit-user-select: none;
            outline: none;
        }

        /* เอฟเฟกต์เมื่อปุ่มสีฟ้าถูกเลือกด้วยลูกศร (เพิ่ม keyboard-selected) */
        .cat-btn:hover, .cat-btn.keyboard-selected { 
            background: #2b78e4 !important; 
            color: white !important;
            transform: translateY(-5px); 
            border-color: #1a73e8;
            box-shadow: 0 8px 20px rgba(43, 120, 228, 0.4);
        }

        .delete-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: 0.2s;
            z-index: 5;
        }
        .delete-btn:hover { background: #cc0000; transform: scale(1.1); }

        .manage-tools {
            display: flex;
            gap: 12px;
        }
        
        .tool-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 5px;
        }
        .tool-btn:hover { color: #2b78e4; }

        .add-circle {
            width: 65px; height: 65px;
            background: #34a853; color: white;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 40px; margin: 0 auto 10px;
            cursor: pointer; border: none; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(52, 168, 83, 0.3);
        }
        .add-circle:hover { transform: scale(1.1); background: #2d9249; }

        .hint-text { color: #999; font-size: 14px; margin-bottom: 20px; }

        #offlineMsg {
            display: none;
            background: #ff9800;
            color: white;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        #modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-content { background: white; padding: 30px; border-radius: 25px; width: 400px; max-height: 85vh; overflow-y: auto; text-align: left; }
        .input-style { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-family: 'Kanit'; }
        .btn-save { background: #34a853; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-close { background: #f0f2f5; color: #555; border: none; padding: 10px; width: 100%; border-radius: 10px; cursor: pointer; margin-top: 8px; }
        .word-chip { display: inline-block; background: #e8f0fe; padding: 6px 14px; border-radius: 20px; margin: 4px; font-size: 14px; color: #2b78e4; }
    </style>
</head>
<body>

<div class="card">
    <h1>FlashAI</h1>
    <div id="offlineMsg">โหมดออฟไลน์: กำลังแสดงข้อมูลที่บันทึกไว้ในเครื่อง</div>
    <div class="user-info" id="userInfo">ผู้เล่น: </div>

    <h3>เลือกหมวดหมู่ที่จะเล่น</h3>
    
    <div id="categoryArea"></div>

    <button class="add-circle" onclick="openCreateModal()">+</button>
    <div class="hint-text">ใช้ลูกศร ⬅️ ➡️ เพื่อเลือก และกด Enter เพื่อเข้าเล่น</div>
</div>

<div id="modal">
    <div class="modal-content" id="modalContent"></div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log(err));
        });
    }

    let fullData = {};
    const playerName = localStorage.getItem("name") || "Guest";
    const protectedCategories = ["animals", "fruits", "animal", "fruit"]; 
    let currentCatIndex = -1; 

    document.getElementById("userInfo").innerText = `ผู้เล่น: ${playerName}`;

    async function loadData() {
        try {
            const res = await fetch("/api/all-data");
            fullData = await res.json();
            localStorage.setItem("offline_categories", JSON.stringify(fullData));
            document.getElementById("offlineMsg").style.display = "none";
            renderMenu();
        } catch (err) {
            const localData = localStorage.getItem("offline_categories");
            if (localData) {
                fullData = JSON.parse(localData);
                document.getElementById("offlineMsg").style.display = "block";
                renderMenu();
            }
        }
    }

    function renderMenu() {
        const area = document.getElementById("categoryArea");
        area.innerHTML = "";
        currentCatIndex = -1; 
        
        Object.keys(fullData).forEach(cat => {
            const wrapper = document.createElement("div");
            wrapper.className = "cat-item-wrapper";

            const btn = document.createElement("button");
            btn.className = "cat-btn"; 
            btn.innerText = cat.toUpperCase();
            btn.onclick = () => startGame(cat);

            if (!protectedCategories.includes(cat.toLowerCase())) {
                const delBtn = document.createElement("button");
                delBtn.className = "delete-btn";
                delBtn.innerHTML = "×";
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteCategory(cat);
                };
                wrapper.appendChild(delBtn);
            }

            const tools = document.createElement("div");
            tools.className = "manage-tools";
            tools.innerHTML = `
                <button class="tool-btn" onclick="viewWords('${cat}')" tabindex="-1">👁️ ดูคำ</button>
                <button class="tool-btn" onclick="openAddWordModal('${cat}')" tabindex="-1">➕ เพิ่ม</button>
            `;

            wrapper.appendChild(btn);
            wrapper.appendChild(tools);
            area.appendChild(wrapper);
        });
    }

    /* 🎮 ระบบคีย์บอร์ด: ⬅️ ➡️ เท่านั้น ล็อคเฉพาะปุ่มสีฟ้า และเปลี่ยนทันที */
    document.addEventListener("keydown", function(e) {
        const isModalOpen = document.getElementById("modal").style.display === "flex";
        if (isModalOpen || e.target.tagName === "INPUT") return;

        // ดึงเฉพาะปุ่มที่มีคลาส .cat-btn
        const categoryButtons = document.querySelectorAll(".cat-btn");
        if (categoryButtons.length === 0) return;

        // ⬅️ ➡️ เท่านั้น
        if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
            e.preventDefault(); 
            
            if (e.key === "ArrowRight") {
                currentCatIndex = (currentCatIndex + 1) % categoryButtons.length;
            } else {
                currentCatIndex = (currentCatIndex - 1 + categoryButtons.length) % categoryButtons.length;
            }
            
            updateSelection(categoryButtons);
        } 
        
        else if (e.key === "Enter" && currentCatIndex !== -1) {
            e.preventDefault();
            categoryButtons[currentCatIndex].click();
        }
    });

    function updateSelection(buttons) {
        buttons.forEach((btn, index) => {
            if (index === currentCatIndex) {
                btn.classList.add("keyboard-selected");
                btn.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                btn.classList.remove("keyboard-selected");
            }
        });
    }

    async function deleteCategory(cat) {
        if (!confirm(`ต้องการลบหมวดหมู่ "${cat.toUpperCase()}"?`)) return;
        try {
            const res = await fetch(`/api/category/${cat}`, { method: "DELETE" });
            if (res.ok) loadData();
        } catch (err) { alert("ลบไม่ได้ในโหมดออฟไลน์"); }
    }

    function openAddWordModal(cat) {
        const modal = document.getElementById("modal");
        const content = document.getElementById("modalContent");
        modal.style.display = "flex";
        content.innerHTML = `
            <h3 style="margin-top:0;">เพิ่มคำในหมวด ${cat.toUpperCase()}</h3>
            <input type="text" id="newWordInput" class="input-style" placeholder="พิมพ์คำศัพท์..." autocomplete="off">
            <button class="btn-save" onclick="saveNewWord('${cat}')">บันทึกคำศัพท์</button>
            <button class="btn-close" onclick="closeModal()">ยกเลิก</button>
        `;
        document.getElementById("newWordInput").focus();
    }

    async function saveNewWord(cat) {
        const word = document.getElementById("newWordInput").value.trim();
        if(!word) return;
        try {
            const res = await fetch("/api/category/add-word", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ categoryName: cat, word: word })
            });
            if(res.ok) { closeModal(); loadData(); }
        } catch (err) { alert("บันทึกไม่ได้ในโหมดออฟไลน์"); }
    }

    function viewWords(cat) {
        const modal = document.getElementById("modal");
        const content = document.getElementById("modalContent");
        modal.style.display = "flex";
        let chips = fullData[cat].map(w => `<span class="word-chip">${w}</span>`).join('');
        content.innerHTML = `
            <h3>คำศัพท์ในหมวด: ${cat.toUpperCase()}</h3>
            <div style="margin-bottom:20px; background:#f9f9f9; padding:15px; border-radius:15px; max-height:300px; overflow-y:auto;">${chips}</div>
            <button class="btn-close" onclick="closeModal()">ปิดหน้าต่าง</button>
        `;
    }

    function openCreateModal() {
        const modal = document.getElementById("modal");
        const content = document.getElementById("modalContent");
        modal.style.display = "flex";
        content.innerHTML = `
            <h3 style="margin-top:0;">สร้างหมวดหมู่ใหม่</h3>
            <input type="text" id="newCatName" class="input-style" placeholder="ชื่อหมวดหมู่...">
            <div id="wordInputs" style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                ${Array.from({length: 10}, (_, i) => `<input type="text" class="input-style word-input" placeholder="คำที่ ${i+1}">`).join('')}
            </div>
            <button class="btn-save" onclick="saveNewCategory()">บันทึกหมวดหมู่</button>
            <button class="btn-close" onclick="closeModal()">ยกเลิก</button>
        `;
    }

    async function saveNewCategory() {
        const name = document.getElementById("newCatName").value.trim();
        const words = Array.from(document.querySelectorAll(".word-input")).map(i => i.value.trim()).filter(v => v !== "");
        if(!name || words.length < 10) return alert("กรุณากรอกให้ครบ");
        try {
            await fetch("/api/category", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ categoryName: name, items: words })
            });
            closeModal(); loadData();
        } catch (err) { alert("สร้างไม่ได้ในโหมดออฟไลน์"); }
    }

    async function startGame(category) {
        localStorage.setItem("selectedCategory", category);
        try {
            await fetch("/api/start", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: playerName, category })
            });
        } catch (err) {}
        location.href = "game.html";
    }

    function closeModal() { document.getElementById("modal").style.display = "none"; }

    loadData();
</script>
</body>
</html>
