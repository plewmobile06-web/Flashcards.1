<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>AI Quiz Game - Special Edition</title>
    <style>
        body { font-family: 'Arial', sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        h1 { color: #1a73e8; }
        input { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #ddd; width: 80%; margin-bottom: 10px; box-sizing: border-box; }
        
        /* สไตล์หมวดหมู่ */
        #categoryArea { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px 0; }
        .cat-item { padding: 12px 20px; background: #e8f0fe; color: #1967d2; border-radius: 50px; cursor: pointer; transition: 0.3s; font-weight: bold; border: 2px solid transparent; }
        .cat-item:hover { background: #d2e3fc; }
        .cat-item.active { background: #1a73e8; color: white; border-color: #174ea6; }

        /* ปุ่มบวก */
        .add-btn { width: 50px; height: 50px; background: #34a853; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; cursor: pointer; margin: 10px auto; transition: 0.3s; }
        .add-btn:hover { transform: rotate(90deg); background: #2d8e47; }

        /* หน้าจอเกม */
        img { width: 100%; max-width: 300px; height: 300px; object-fit: contain; margin: 20px 0; border-radius: 15px; background: #fafafa; border: 1px solid #eee; }
        .btn-option { padding: 12px 25px; margin: 8px; font-size: 18px; cursor: pointer; border-radius: 10px; border: none; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s; min-width: 140px; }
        .btn-option:hover { background: #f8f9fa; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }

        /* Modal (หน้าต่างเด้ง) - แก้ไข display ให้ถูกต้องแล้ว */
        #categoryModal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); 
            z-index: 1000; 
            align-items: center; 
            justify-content: center; 
        }
        .modal-content { background: white; width: 90%; max-width: 400px; padding: 25px; border-radius: 20px; max-height: 85vh; overflow-y: auto; text-align: left; }
        .word-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .modal-content input { width: 100%; margin: 4px 0; padding: 8px; }
        .action-btn { padding: 12px; width: 100%; margin-top: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .action-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Quiz Game</h1>

    <div id="startScreen">
        <input type="text" id="playerName" placeholder="กรอกชื่อผู้เล่นของคุณ">
        
        <h3 style="margin-top: 25px;">เลือกหมวดหมู่ที่จะเล่น</h3>
        <div id="categoryArea"></div>

        <div class="add-btn" onclick="openModal()" title="สร้างหมวดหมู่ใหม่เอง">+</div>
        <p style="font-size: 12px; color: #666;">กดเครื่องหมาย + เพื่อเพิ่มหมวดหมู่ใหม่</p>
        
        <button onclick="startGame()" style="margin-top:20px; padding: 15px 40px; background: #1a73e8; color: white; border-radius: 10px; border: none; font-size: 20px; cursor: pointer;">เริ่มเล่นเกมเลย!</button>
    </div>

    <div id="gameScreen" style="display:none;">
        <div id="scoreBoard" style="font-size: 18px; font-weight: bold; color: #555;"></div>
        <img id="image" src="">
        <div id="options"></div>
    </div>
</div>

<div id="categoryModal">
    <div class="modal-content">
        <h2 style="margin-top:0;">✨ สร้างหมวดหมู่ใหม่</h2>
        <label>ชื่อหมวดหมู่ (เช่น Jobs, Flowers):</label>
        <input type="text" id="newCatName" placeholder="ระบุชื่อหมวดหมู่ (ภาษาอังกฤษ)...">
        
        <p style="font-size: 14px; color: #d93025; font-weight: bold; margin-top: 15px;">กรอกคำศัพท์ภาษาอังกฤษ 10 คำ:</p>
        <div class="word-grid" id="wordInputs"></div>
        
        <button class="action-btn" onclick="saveCategory()" style="background: #34a853; color: white;">✅ บันทึกและใช้งาน</button>
        <button class="action-btn" onclick="closeModal()" style="background: #f1f3f4; color: #5f6368;">ยกเลิก</button>
    </div>
</div>

<script>
    let currentName = "";
    let selectedCategory = "";

    // ฟังก์ชันเปิดหน้าต่าง Modal
    function openModal() {
        const modal = document.getElementById("categoryModal");
        modal.style.display = "flex"; 
        
        const container = document.getElementById("wordInputs");
        container.innerHTML = ""; // ล้างข้อมูลเก่า
        for (let i = 1; i <= 10; i++) {
            container.innerHTML += `<input type="text" class="word-input" placeholder="คำที่ ${i}">`;
        }
    }

    // ฟังก์ชันปิดหน้าต่าง Modal
    function closeModal() {
        document.getElementById("categoryModal").style.display = "none";
    }

    // 1. ดึงรายการหมวดหมู่
    async function fetchCategories() {
        try {
            const res = await fetch("/api/categories");
            const categories = await res.json();
            const area = document.getElementById("categoryArea");
            area.innerHTML = "";

            categories.forEach(cat => {
                const div = document.createElement("div");
                div.className = "cat-item";
                div.innerText = cat.toUpperCase();
                div.onclick = () => {
                    document.querySelectorAll(".cat-item").forEach(el => el.classList.remove("active"));
                    div.classList.add("active");
                    selectedCategory = cat;
                };
                area.appendChild(div);
            });
        } catch (err) { console.error("Error:", err); }
    }

    // 2. บันทึกหมวดหมู่ใหม่
    async function saveCategory() {
        const name = document.getElementById("newCatName").value.trim();
        const inputs = document.querySelectorAll(".word-input");
        const items = Array.from(inputs).map(i => i.value.trim()).filter(v => v !== "");

        if (!name || items.length < 10) {
            alert("กรุณากรอกชื่อหมวดหมู่และคำศัพท์ให้ครบ 10 คำนะครับ");
            return;
        }

        const res = await fetch("/api/category", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ categoryName: name, items: items })
        });

        if (res.ok) {
            alert("เพิ่มหมวดหมู่เรียบร้อย!");
            closeModal();
            fetchCategories(); // รีโหลดรายการหมวดหมู่ใหม่
        }
    }

    // 3. เริ่มเกม
    async function startGame() {
        currentName = document.getElementById("playerName").value.trim();
        if (!currentName || !selectedCategory) {
            alert("กรุณากรอกชื่อและเลือกหมวดหมู่ก่อนครับ");
            return;
        }

        await fetch("/api/start", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: currentName, category: selectedCategory })
        });

        document.getElementById("startScreen").style.display = "none";
        document.getElementById("gameScreen").style.display = "block";
        loadQuestion();
    }

    // 4. โหลดคำถาม
    async function loadQuestion() {
        const res = await fetch(`/api/question/${currentName}`);
        const data = await res.json();

        if (data.gameOver) {
            alert(`จบเกม! คะแนนของคุณคือ: ${data.score}`);
            location.reload();
            return;
        }

        document.getElementById("image").src = data.image;
        document.getElementById("scoreBoard").innerText = `คะแนน: ${data.score} | ผิด: ${data.wrong}/5`;

        const optionsDiv = document.getElementById("options");
        optionsDiv.innerHTML = "";
        data.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "btn-option";
            btn.innerText = opt;
            btn.onclick = () => submitAnswer(opt);
            optionsDiv.appendChild(btn);
        });
    }

    // 5. ส่งคำตอบ
    async function submitAnswer(answer) {
        await fetch(`/api/answer/${currentName}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ answer })
        });
        loadQuestion();
    }

    // รันครั้งแรกเมื่อเปิดเว็บ
    fetchCategories();
</script>

</body>
</html>
