<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เข้าสู่ระบบ - FlashAI</title>

<style>
/* ใช้ Font Kanit เพื่อความสวยงาม */
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Kanit', sans-serif;
  background: #f0f2f5;
}

.card {
  background: white;
  padding: 40px;
  border-radius: 25px;
  width: 320px;
  text-align: center;
  box-shadow: 0 15px 35px rgba(0,0,0,0.1);
}

h2 {
  margin-bottom: 20px;
  color: #1a73e8;
}

input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid #ddd;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  background: #4CAF50;
  color: white;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

button:hover {
  background: #45a049;
  transform: translateY(-2px);
}

.register-link {
  margin-top: 20px;
  font-size: 14px;
  color: #666;
}

.register-link a {
  color: #1a73e8;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="card">
  <h2>เข้าสู่ระบบ</h2>

  <form id="loginForm">
    <input id="name" placeholder="ชื่อผู้ใช้" required autocomplete="username">
    <input id="password" type="password" placeholder="รหัสผ่าน" required autocomplete="current-password">
    <button type="submit">เข้าสู่ระบบ</button>
  </form>

  <div class="register-link">
    ยังไม่มีบัญชี? <a href="register.html">ลงทะเบียนที่นี่</a>
  </div>
</div>

<script>
const form = document.getElementById("loginForm");
const nameInput = document.getElementById("name");
const passwordInput = document.getElementById("password");

/* ✨ ระบบ Auto-Capitalize และ Enter ย้ายช่อง */
let isShiftPressed = false;

nameInput.addEventListener("keydown", (e) => {
    if (e.key === "Shift") isShiftPressed = true;
    if (e.key === "Enter") {
        e.preventDefault();
        passwordInput.focus();
    }
});

nameInput.addEventListener("keyup", (e) => {
    if (e.key === "Shift") isShiftPressed = false;
});

nameInput.addEventListener("input", function(e) {
    let cursorStart = this.selectionStart;
    let val = this.value;
    let lastCharIndex = cursorStart - 1;
    
    if (lastCharIndex >= 0) {
        let isFirstChar = (lastCharIndex === 0);
        let isAfterSpace = (val.charAt(lastCharIndex - 1) === " ");

        if ((isFirstChar || isAfterSpace) && !isShiftPressed) {
            let char = val.charAt(lastCharIndex);
            this.value = val.slice(0, lastCharIndex) + char.toUpperCase() + val.slice(cursorStart);
            this.setSelectionRange(cursorStart, cursorStart);
        }
    }
});

/* 🔥 ระบบตรวจสอบข้อมูลกับ Server */
form.addEventListener("submit", async function(e){
    e.preventDefault();

    const username = nameInput.value.trim();
    const password = passwordInput.value;

    if(!username || !password){
        alert("กรอกข้อมูลให้ครบ");
        return;
    }

    try {
        const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
            // เก็บข้อมูลลง LocalStorage
            localStorage.setItem("name", data.username);
            localStorage.setItem("playerName", data.username);
            
            // ✅ ย้ายไปหน้าเมนู
            location.href = "menu.html";
        } else {
            alert(data.error || "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");
        }
    } catch (err) {
        console.error("Login Error:", err);
        alert("ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้");
    }
});

/* กัน Space ในช่องรหัสผ่าน */
passwordInput.addEventListener("input", function(){
    this.value = this.value.replace(/\s/g, "");
});
</script>

</body>
</html>
