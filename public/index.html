<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Login - AI Quiz Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');
        body { 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-family: 'Kanit', sans-serif; 
            background: #f0f2f5; 
        }
        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 25px; 
            width: 350px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        h1 { color: #1a73e8; margin-bottom: 25px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 10px; 
            border: 1px solid #ddd; 
            box-sizing: border-box; 
            font-size: 16px; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #1a73e8; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 18px; 
            font-weight: bold; 
            transition: 0.3s; 
        }
        button:hover { background: #1557b0; }
    </style>
</head>
<body>

<div class="card">
    <h1>Login</h1>
    <form id="loginForm">
        <input type="text" id="name" placeholder="ชื่อผู้เล่น (Username)" required autocomplete="off">
        <input type="password" id="password" placeholder="รหัสผ่าน (Password)" required>
        <button type="submit">เข้าสู่เกม</button>
    </form>
</div>

<script>
    const nameInput = document.getElementById("name");
    const loginForm = document.getElementById("loginForm");

    /* ✨ ระบบ Auto-Capitalize (ตัวแรก/หลังเว้นวรรค เป็นตัวใหญ่) */
    let isShiftPressed = false;

    nameInput.addEventListener("keydown", (e) => {
        if (e.key === "Shift") isShiftPressed = true;
    });

    nameInput.addEventListener("keyup", (e) => {
        if (e.key === "Shift") isShiftPressed = false;
    });

    nameInput.addEventListener("input", function(e) {
        let cursorStart = this.selectionStart;
        let val = this.value;
        let lastCharIndex = cursorStart - 1;
        
        if (lastCharIndex >= 0) {
            let isFirstChar = (lastCharIndex === 0);
            let isAfterSpace = (val.charAt(lastCharIndex - 1) === " ");

            // ถ้าเป็นตัวแรก หรือหลังเว้นวรรค และไม่ได้กด Shift ให้เป็นตัวใหญ่
            if ((isFirstChar || isAfterSpace) && !isShiftPressed) {
                let char = val.charAt(lastCharIndex);
                this.value = val.slice(0, lastCharIndex) + char.toUpperCase() + val.slice(cursorStart);
                this.setSelectionRange(cursorStart, cursorStart);
            }
        }
    });

    /* 🔥 ฟังก์ชันส่งข้อมูล */
    loginForm.addEventListener("submit", function(e) {
        e.preventDefault();
        const nameValue = nameInput.value.trim();
        const passwordValue = document.getElementById("password").value;

        if(nameValue && passwordValue) {
            // เก็บข้อมูลลง LocalStorage ทั้งสองรูปแบบเพื่อรองรับทุกหน้า
            localStorage.setItem("name", nameValue);
            localStorage.setItem("password", passwordValue);
            localStorage.setItem("playerName", nameValue);
            localStorage.setItem("playerPass", passwordValue);

            location.href = "menu.html"; 
        }
    });
</script>
</body>
</html>
